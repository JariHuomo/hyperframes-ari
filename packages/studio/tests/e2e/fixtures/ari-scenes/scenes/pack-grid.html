<!doctype html>
<html lang="fi">
  <head>
    <meta charset="utf-8" />
    <title>Testikauppa — pakkausruudukko</title>
    <style>
      #pack-grid-root {
        position: relative;
        width: 924px;
        height: 722px;
        overflow: visible;
      }
      #pack-grid-root .pack {
        position: absolute;
        left: 0;
        top: 0;
        width: 408px;
        height: 230px;
        filter: drop-shadow(0 10px 0 rgba(89, 19, 18, 0.12));
        transform-origin: 50% 50%;
      }
      #pack-grid-root .pack img {
        position: absolute;
        top: -92px;
        left: 0;
        width: 408px;
        height: 408px;
        clip-path: polygon(
          2% 23%,
          6% 23%,
          13% 25%,
          86% 25%,
          93% 23%,
          98% 23%,
          98% 77%,
          94% 77%,
          86% 75%,
          15% 75%,
          7% 77%,
          2% 77%
        );
      }
    </style>
  </head>
  <body>
    <section
      id="pack-grid-root"
      data-hf-id="pack-grid-root"
      data-composition-id="pack-grid"
      data-width="924"
      data-height="722"
      data-start="0"
      data-duration="7"
      data-layout-allow-overflow
      data-no-timeline
    >
      <div class="pack" id="pack1" data-hf-id="pack-1">
        <img
          id="pack1-image"
          data-hf-id="pack-1-image"
          src="../assets/pack.svg"
          alt="Testipatukka-pakkaus 1"
        />
      </div>
      <div class="pack" id="pack2" data-hf-id="pack-2">
        <img
          id="pack2-image"
          data-hf-id="pack-2-image"
          src="../assets/pack.svg"
          alt="Testipatukka-pakkaus 2"
        />
      </div>
      <div class="pack" id="pack3" data-hf-id="pack-3">
        <img
          id="pack3-image"
          data-hf-id="pack-3-image"
          src="../assets/pack.svg"
          alt="Testipatukka-pakkaus 3"
        />
      </div>
      <div class="pack" id="pack4" data-hf-id="pack-4">
        <img
          id="pack4-image"
          data-hf-id="pack-4-image"
          src="../assets/pack.svg"
          alt="Testipatukka-pakkaus 4"
        />
      </div>
      <div class="pack" id="pack5" data-hf-id="pack-5">
        <img
          id="pack5-image"
          data-hf-id="pack-5-image"
          src="../assets/pack.svg"
          alt="Testipatukka-pakkaus 5"
        />
      </div>
      <div class="pack" id="pack6" data-hf-id="pack-6">
        <img
          id="pack6-image"
          data-hf-id="pack-6-image"
          src="../assets/pack.svg"
          alt="Testipatukka-pakkaus 6"
        />
      </div>
    </section>
    <script>
      // Six continuous physical identities. The packet opens, then holds for reading.
      // Times are unchanged from rajamarket-sprint-mixed; this host runs at
      // data-start="0" / data-playback-rate="1", so scene time == master time here.
      gsap.set("#pack1-image", { x: 16, y: 0 });
      var tl = gsap.timeline({ paused: true });
      tl.fromTo(
        "#pack1",
        { x: 197, y: 84, rotation: -7 },
        { x: 0, y: 0, rotation: -4, duration: 1.3, ease: "power3.inOut" },
        0.5,
      );
      tl.fromTo(
        "#pack2",
        { x: 223, y: 116, rotation: -4 },
        { x: 516, y: 0, rotation: 4, duration: 1.3, ease: "power3.inOut" },
        0.61,
      );
      tl.fromTo(
        "#pack3",
        { x: 249, y: 148, rotation: -1 },
        { x: 0, y: 246, rotation: -4, duration: 1.3, ease: "power3.inOut" },
        0.72,
      );
      tl.fromTo(
        "#pack4",
        { x: 275, y: 180, rotation: 2 },
        { x: 516, y: 246, rotation: 4, duration: 1.3, ease: "power3.inOut" },
        0.83,
      );
      tl.fromTo(
        "#pack5",
        { x: 301, y: 212, rotation: 5 },
        { x: 0, y: 492, rotation: -4, duration: 1.3, ease: "power3.inOut" },
        0.94,
      );
      tl.fromTo(
        "#pack6",
        { x: 327, y: 244, rotation: 8 },
        { x: 516, y: 492, rotation: 4, duration: 1.3, ease: "power3.inOut" },
        1.05,
      );
      // Hold the grid on screen to the end of the master's 7 s.
      tl.set("#pack6", { rotation: 4 }, 7);
      window.__timelines = window.__timelines || {};
      window.__timelines["pack-grid"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
